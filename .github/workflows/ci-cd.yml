name: ecommerce-ci-cd

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: [auth-service, user-service, product-service, cart-service, order-service, payment-service, notification-service, inventory-service]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and coverage gate
        run: >-
          mvn -T 1C -f ${{ matrix.service }}/pom.xml
          -B -ntp
          clean verify jacoco:report jacoco:check

  quality-security:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: SonarQube scan
        run: echo "Invoke sonar scanner with quality gate"
      - name: Container image scan
        run: echo "Trivy scan placeholder"

  docker-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: quality-security
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build images
        run: |
          docker build -t ghcr.io/example/auth-service:${{ github.sha }} auth-service
          docker build -t ghcr.io/example/user-service:${{ github.sha }} user-service
          docker build -t ghcr.io/example/product-service:${{ github.sha }} product-service
          docker build -t ghcr.io/example/cart-service:${{ github.sha }} cart-service
          docker build -t ghcr.io/example/order-service:${{ github.sha }} order-service
          docker build -t ghcr.io/example/payment-service:${{ github.sha }} payment-service
          docker build -t ghcr.io/example/notification-service:${{ github.sha }} notification-service
          docker build -t ghcr.io/example/inventory-service:${{ github.sha }} inventory-service
      - name: Push images
        run: echo "docker login + docker push"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docker-push
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Deploy to Kubernetes
        run: kubectl apply -f k8s/base
