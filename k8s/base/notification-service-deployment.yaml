apiVersion: apps/v1
kind: Deployment
metadata: { name: notification-service }
spec:
  replicas: 3
  selector: { matchLabels: { app: notification-service } }
  template:
    metadata: { labels: { app: notification-service } }
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/example/notification-service:latest
          ports: [{ containerPort: 8087 }]
          readinessProbe: { httpGet: { path: /actuator/health, port: 8087 } }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8087 } }
---
apiVersion: v1
kind: Service
metadata: { name: notification-service }
spec:
  selector: { app: notification-service }
  ports: [{ port: 80, targetPort: 8087 }]
