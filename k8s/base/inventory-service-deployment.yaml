apiVersion: apps/v1
kind: Deployment
metadata: { name: inventory-service }
spec:
  replicas: 3
  selector: { matchLabels: { app: inventory-service } }
  template:
    metadata: { labels: { app: inventory-service } }
    spec:
      containers:
        - name: inventory-service
          image: ghcr.io/example/inventory-service:latest
          ports: [{ containerPort: 8088 }]
          readinessProbe: { httpGet: { path: /actuator/health, port: 8088 } }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8088 } }
---
apiVersion: v1
kind: Service
metadata: { name: inventory-service }
spec:
  selector: { app: inventory-service }
  ports: [{ port: 80, targetPort: 8088 }]
