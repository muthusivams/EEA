openapi: 3.0.3
info:
  title: User Service API
  version: 1.0.0
paths:
  /users:
    post:
      summary: Create profile
      responses:
        '200':
          description: Created
  /users/{externalAuthId}:
    get:
      summary: Fetch profile by auth id
      responses:
        '200':
          description: Profile
        '404':
          description: Not found
