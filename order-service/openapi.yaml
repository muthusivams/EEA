openapi: 3.0.3
info: { title: Order Service API, version: 1.0.0 }
paths:
  /orders:
    post:
      summary: Create order
      responses: { '200': { description: Created } }
  /orders/{orderNumber}:
    get:
      summary: Get order by number
      responses: { '200': { description: Found }, '404': { description: Not found } }
