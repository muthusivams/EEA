version: '3.9'
services:
  redis:
    image: redis:7
    ports: ["6379:6379"]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  discovery-server:
    image: eclipse-temurin:21-jre
    volumes: ["./discovery-server:/app"]
    command: ["sh","-c","echo 'discovery stub'"]
    ports: ["8761:8761"]

  config-server:
    image: eclipse-temurin:21-jre
    volumes: ["./config-server:/app"]
    command: ["sh","-c","echo 'config stub'"]
    ports: ["8888:8888"]

  postgres-auth:
    image: postgres:16
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth

  postgres-user:
    image: postgres:16
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user

  postgres-product:
    image: postgres:16
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: product
      POSTGRES_PASSWORD: product

  postgres-cart:
    image: postgres:16
    environment:
      POSTGRES_DB: cartdb
      POSTGRES_USER: cart
      POSTGRES_PASSWORD: cart


  postgres-order:
    image: postgres:16
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order

  postgres-payment:
    image: postgres:16
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment

  postgres-notification:
    image: postgres:16
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification

  postgres-inventory:
    image: postgres:16
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory

  auth-service:
    build: ./auth-service
    ports: ["8081:8081"]
    depends_on: [postgres-auth, redis, kafka]

  user-service:
    build: ./user-service
    ports: ["8082:8082"]
    depends_on: [postgres-user]

  product-service:
    build: ./product-service
    ports: ["8083:8083"]
    depends_on: [postgres-product, redis]

  cart-service:
    build: ./cart-service
    ports: ["8084:8084"]
    depends_on: [postgres-cart]


  order-service:
    build: ./order-service
    ports: ["8085:8085"]
    depends_on: [postgres-order, kafka]

  payment-service:
    build: ./payment-service
    ports: ["8086:8086"]
    depends_on: [postgres-payment, kafka]

  notification-service:
    build: ./notification-service
    ports: ["8087:8087"]
    depends_on: [postgres-notification, kafka]

  inventory-service:
    build: ./inventory-service
    ports: ["8088:8088"]
    depends_on: [postgres-inventory]

  api-gateway:
    image: eclipse-temurin:21-jre
    volumes: ["./api-gateway:/app"]
    command: ["sh","-c","echo 'gateway stub'"]
    ports: ["8080:8080"]
